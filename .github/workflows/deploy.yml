name: Continuous Deployment & CMS Pipeline

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ cms_publish, cms_webhook, cms_event, content_update ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: Deploy to Staging Environment (beta.sprachcafe-polnisch.org)
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging (beta.sprachcafe-polnisch.org)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🔄 Fetch Content via CMS-API & Build Astro Site & Generate Pagefind Index
        run: |
          cd frontend
          npm run build

      - name: 🔑 Configure SSH Key & Known Hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ] && [ -n "$SSH_HOST" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          else
            echo "⚠️ LIGHTSAIL_SSH_KEY or LIGHTSAIL_HOST not set. Skipping SSH setup for dry-run validation."
          fi

      - name: 🚀 Deploy /dist via rsync to Staging (/var/www/beta)
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          TARGET_DIR: /var/www/beta/
        run: |
          if [ -n "${{ secrets.LIGHTSAIL_SSH_KEY }}" ] && [ -n "${{ secrets.LIGHTSAIL_HOST }}" ]; then
            rsync -avz --delete \
              -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
              frontend/dist/ \
              ${SSH_USER}@${SSH_HOST}:${TARGET_DIR}
            
            # Reload Caddy Server
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} \
              "docker exec library_proxy caddy reload --config /etc/caddy/Caddyfile"
            
            echo "✅ Successfully deployed to Staging (${TARGET_DIR})"
          else
            echo "⚠️ Deployment skipped: LIGHTSAIL_SSH_KEY secret not present."
          fi

  # =========================================================================
  # JOB 2: Deploy to Production Environment (sprachcafe-polnisch.org)
  # =========================================================================
  deploy-production:
    name: Deploy to Production (sprachcafe-polnisch.org)
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: 🔄 Fetch Content via CMS-API & Build Astro Site & Generate Pagefind Index
        run: |
          cd frontend
          npm run build

      - name: 🔑 Configure SSH Key & Known Hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ] && [ -n "$SSH_HOST" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          else
            echo "⚠️ LIGHTSAIL_SSH_KEY or LIGHTSAIL_HOST not set. Skipping SSH setup for dry-run validation."
          fi

      - name: 🚀 Deploy /dist via rsync to Production (/var/www/production)
        env:
          SSH_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          TARGET_DIR: /var/www/production/
        run: |
          if [ -n "${{ secrets.LIGHTSAIL_SSH_KEY }}" ] && [ -n "${{ secrets.LIGHTSAIL_HOST }}" ]; then
            rsync -avz --delete \
              -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
              frontend/dist/ \
              ${SSH_USER}@${SSH_HOST}:${TARGET_DIR}
            
            # Reload Caddy Server
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} \
              "docker exec library_proxy caddy reload --config /etc/caddy/Caddyfile"
            
            echo "✅ Successfully deployed to Production (${TARGET_DIR})"
          else
            echo "⚠️ Deployment skipped: LIGHTSAIL_SSH_KEY secret not present."
          fi
