version: '3.8'

# Docker Compose Setup for SprachCafé Relaunch Monorepo
# RAM-Optimized for 2 GB Lightsail Host (Caddy Reverse Proxy, Astro Frontend)

services:
  # Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: sprachcafe_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-sprachcafe-polnisch.org}
      - BETA_DOMAIN_NAME=${BETA_DOMAIN_NAME:-beta.sprachcafe-polnisch.org}
      - ACME_EMAIL=${ACME_EMAIL:-admin@sprachcafe-polnisch.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/sprachcafe/production:/opt/sprachcafe/production:ro
      - /opt/sprachcafe/beta:/opt/sprachcafe/beta:ro
      - /var/www/production:/var/www/production:ro
      - /var/www/beta:/var/www/beta:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    depends_on:
      - frontend

  # Frontend (Astro SSG/SSR)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sprachcafe_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

volumes:
  caddy_data:
  caddy_config:
