version: '3.8'

# Docker Compose Setup for SprachCafé Relaunch Monorepo
# RAM-Optimized for 2 GB Lightsail Host (Embedded SQLite Database, Caddy Reverse Proxy, Astro Frontend)

services:
  # Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: sprachcafe_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-sprachcafe-polnisch.org}
      - BETA_DOMAIN_NAME=${BETA_DOMAIN_NAME:-beta.sprachcafe-polnisch.org}
      - ACME_EMAIL=${ACME_EMAIL:-admin@sprachcafe-polnisch.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/sprachcafe/production:/opt/sprachcafe/production:ro
      - /opt/sprachcafe/beta:/opt/sprachcafe/beta:ro
      - /var/www/production:/var/www/production:ro
      - /var/www/beta:/var/www/beta:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    depends_on:
      - frontend
      - cms

  # Headless CMS (Node.js + Embedded SQLite 3)
  cms:
    build:
      context: ../cms
      dockerfile: Dockerfile
    container_name: sprachcafe_cms
    restart: unless-stopped
    environment:
      PORT: ${CMS_PORT:-3000}
      CMS_ADMIN_SECRET: ${CMS_ADMIN_SECRET:-sprachcafe-cms-secret-jwt-key-2026}
      DB_CLIENT: ${DB_CLIENT:-sqlite3}
      DB_DIR: /opt/sprachcafe/cms-data
      DB_FILENAME: ${DB_FILENAME:-/opt/sprachcafe/cms-data/cms.db}
      ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:-admin@sprachcafe-polnisch.org}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET_MEDIA:-sprachcafe-media-storage}
      POWER_AUTOMATE_MEMBER_WEBHOOK_URL: ${POWER_AUTOMATE_MEMBER_WEBHOOK_URL}
      POWER_AUTOMATE_EVENT_WEBHOOK_URL: ${POWER_AUTOMATE_EVENT_WEBHOOK_URL}
      POWER_AUTOMATE_CONTACT_WEBHOOK_URL: ${POWER_AUTOMATE_CONTACT_WEBHOOK_URL}
    volumes:
      - /opt/sprachcafe/cms-data:/opt/sprachcafe/cms-data
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M

  # Frontend (Astro SSG/SSR)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sprachcafe_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_CMS_API_URL: ${PUBLIC_CMS_API_URL:-http://localhost:8055}
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

volumes:
  caddy_data:
  caddy_config:

